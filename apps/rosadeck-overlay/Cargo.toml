[package]
name = "rosadeck-overlay"
version = "0.1.0"
edition = "2021"
description = "Floating display-selector TUI for Rosadeck (presentation only, never touches Hyprland)"

[[bin]]
name = "rosadeck-overlay"
path = "src/main.rs"

[dependencies]
rosadeck-selector = { path = "../../crates/selector" }
rosadeck-tui-frame = { path = "../../crates/tui-frame" }
display-core = { path = "../../crates/display-core" }
serde_json = "1"
crossterm = "0.29"
