[package]
name = "rosadeck-backend-hyprland"
version = "0.1.0"
edition = "2021"
description = "Read-only Hyprland IPC backend for Rosadeck (socket query + event watch, no mutations)"

[dependencies]
display-core = { path = "../display-core" }
rosadeck-edid = { path = "../edid" }
rosadeck-drm = { path = "../drm" }
rosadeck-planner = { path = "../planner" }
rosadeck-session-core = { path = "../session-core" }
rosadeck-shell-integration = { path = "../shell-integration" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
